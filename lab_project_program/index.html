<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>福建省联迪移动支付研究与应用重点实验室 · 实验项目介绍</title>
<style>
  :root{
    --bg:#070d1a; --bg2:#0b1530; --card:#101c38; --card2:#152548;
    --line:#1e3a6e; --accent:#35e0ff; --accent2:#4f8cff; --gold:#ffc75f;
    --text:#e8f1ff; --muted:#92a4c8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 500px at 20% -10%, #12265c 0%, var(--bg) 55%), var(--bg);
    color:var(--text); min-height:100vh;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px 60px;}

  /* ---------- 头部 ---------- */
  header.hero{
    position:relative; border-radius:0 0 26px 26px; overflow:hidden;
    box-shadow:0 10px 40px rgba(10,40,120,.45);
  }
  header.hero .bg{position:absolute; inset:0; background-size:cover; background-position:center; filter:saturate(1.05);}
  header.hero .veil{position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,10,25,.55) 0%, rgba(7,13,26,.94) 100%);}
  .hero-inner{position:relative; z-index:2; padding:52px 20px 40px; text-align:center;}
  .hero-badge{
    display:inline-block; font-size:12px; letter-spacing:3px; color:var(--accent);
    border:1px solid rgba(53,224,255,.45); border-radius:999px; padding:6px 16px; margin-bottom:18px;
    background:rgba(53,224,255,.08);
  }
  .hero h1{font-size:30px; line-height:1.35; margin-bottom:10px;}
  .hero h1 b{color:var(--accent);}
  .hero p{color:var(--muted); font-size:14px;}
  .searchbar{
    max-width:640px; margin:26px auto 0; display:flex; gap:10px;
  }
  .searchbar input{
    flex:1; border:1px solid var(--line); border-radius:12px; padding:13px 18px;
    background:rgba(9,18,42,.75); color:var(--text); font-size:15px; outline:none;
  }
  .searchbar input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(53,224,255,.15);}
  .searchbar button{
    border:none; border-radius:12px; padding:0 24px; cursor:pointer; font-size:15px; font-weight:600;
    background:linear-gradient(135deg, var(--accent2), var(--accent)); color:#04101f;
  }
  .chips{margin-top:18px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .chips button{
    border:1px solid var(--line); background:rgba(13,25,52,.7); color:var(--muted);
    border-radius:999px; padding:6px 14px; font-size:12.5px; cursor:pointer; transition:.2s;
  }
  .chips button.on{color:#04101f; background:var(--accent); border-color:var(--accent); font-weight:600;}

  /* ---------- 主区 ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin:28px 0 16px; flex-wrap:wrap;
  }
  .tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .tabs button{
    border:1px solid var(--line); color:var(--muted); background:var(--card);
    border-radius:10px; padding:8px 14px; font-size:13px; cursor:pointer; transition:.18s;
  }
  .tabs button.on{color:#04101f; background:linear-gradient(135deg,var(--accent2),var(--accent)); border-color:transparent; font-weight:700;}
  .stat{color:var(--muted); font-size:13px;}
  .stat b{color:var(--accent); font-size:16px;}

  #grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:16px;}
  .card{
    background:linear-gradient(160deg, var(--card2), var(--card)); border:1px solid var(--line);
    border-radius:16px; overflow:hidden; cursor:pointer; transition:.22s; display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 12px 30px rgba(20,60,160,.35);}
  .card .pic{height:118px; background-size:cover; background-position:center; position:relative;}
  .card .pic .cid{
    position:absolute; left:10px; top:10px; font-size:11px; letter-spacing:1px;
    background:rgba(4,12,30,.72); color:var(--gold); border:1px solid rgba(255,199,95,.4);
    border-radius:8px; padding:3px 8px;
  }
  .card .pic .cat{
    position:absolute; right:10px; top:10px; font-size:11px;
    background:rgba(53,224,255,.14); color:var(--accent); border:1px solid rgba(53,224,255,.35);
    border-radius:8px; padding:3px 8px;
  }
  .card .body{padding:14px 16px 16px; flex:1; display:flex; flex-direction:column; gap:8px;}
  .card h3{font-size:16px;}
  .card .en{font-size:11px; color:var(--muted); min-height:14px;}
  .card .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto;}
  .card .tags span{
    font-size:11px; color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:2px 8px; background:rgba(255,255,255,.03);
  }
  .empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 0;}
  .empty b{display:block; font-size:18px; color:var(--text); margin-bottom:8px;}

  /* ---------- 详情 ---------- */
  .modal{position:fixed; inset:0; z-index:50; display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:34px 16px;}
  .modal.open{display:flex;}
  .modal .mask{position:fixed; inset:0; background:rgba(3,7,18,.72); backdrop-filter:blur(3px);}
  .detail{
    position:relative; z-index:2; width:100%; max-width:820px; border-radius:18px; overflow:hidden;
    background:linear-gradient(170deg, #14254a, #0d1936); border:1px solid var(--line);
    animation:up .28s ease;
  }
  @keyframes up{from{transform:translateY(26px); opacity:0;} to{transform:none; opacity:1;}}
  .detail .hero{height:170px; background-size:cover; background-position:center; position:relative; border-radius:0;}
  .detail .hero .veil{background:linear-gradient(180deg, rgba(6,12,26,.2), rgba(10,20,42,.92));}
  .detail .dbody{padding:22px 26px 30px;}
  .detail h2{font-size:24px; margin-bottom:4px;}
  .detail .en{color:var(--muted); font-size:13px; margin-bottom:14px;}
  .sect{margin-top:16px;}
  .sect h4{
    font-size:13px; color:var(--accent); letter-spacing:2px; margin-bottom:8px;
    display:flex; align-items:center; gap:8px;
  }
  .sect h4::before{content:""; width:4px; height:14px; border-radius:2px; background:linear-gradient(180deg,var(--accent),var(--accent2));}
  .sect ul{padding-left:18px; color:#c6d4f2; line-height:1.9; font-size:14px;}
  .sect p{color:#c6d4f2; line-height:1.85; font-size:14px;}
  .pillrow{display:flex; flex-wrap:wrap; gap:8px;}
  .pillrow span{
    font-size:12px; color:var(--accent); border:1px solid rgba(53,224,255,.35);
    background:rgba(53,224,255,.08); border-radius:8px; padding:5px 11px;
  }
  .dclose{
    position:absolute; right:16px; top:14px; z-index:3; width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(255,255,255,.25); background:rgba(4,10,24,.5); color:#fff; font-size:16px; cursor:pointer;
  }

  /* ---------- 3D 拆解仿真区 ---------- */
  .simbox{margin-top:18px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#0a1428;}
  .simhead{
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    font-size:12.5px; color:var(--accent); border-bottom:1px solid var(--line);
    background:rgba(53,224,255,.06);
  }
  .simhead .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}
  .simfull{
    margin-left:auto; border:1px solid rgba(53,224,255,.4); background:rgba(53,224,255,.1);
    color:var(--accent); border-radius:8px; padding:3px 10px; font-size:12px; cursor:pointer;
  }
  .simbox iframe{width:100%; height:400px; border:none; display:block; background:#0a1428;}
  .simtip{padding:5px 12px; font-size:11px; color:var(--muted);}
  .simbox.on{
    position:fixed; inset:0; z-index:80; border-radius:0; display:flex; flex-direction:column;
    border:none;
  }
  .simbox.on iframe{flex:1; height:auto;}

  /* ---------- 数字人调用演示 ---------- */
  .demo{
    margin-top:34px; border:1px solid var(--line); border-radius:16px; overflow:hidden;
    background:linear-gradient(160deg, rgba(16,28,56,.85), rgba(10,18,40,.85));
  }
  .demo .dh{
    display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .demo .dh .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent);}
  .demo .dh b{font-size:14px;}
  .demo .dh .tag{font-size:11px; color:var(--gold); border:1px solid rgba(255,199,95,.4); border-radius:6px; padding:2px 8px;}
  .demo .rowg{padding:16px 18px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:760px){.demo .rowg{grid-template-columns:1fr;}}
  .demo label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px; letter-spacing:1px;}
  .demo select,.demo input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px;
    background:rgba(8,16,38,.9); color:var(--text); font-size:13.5px; outline:none;
  }
  .demo textarea{
    width:100%; min-height:76px; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    background:rgba(8,16,38,.75); color:var(--text); font-size:13px; outline:none; resize:vertical; font-family:inherit;
  }
  .demo .btn{
    margin:0 18px 18px; width:calc(100% - 36px); border:none; border-radius:12px; padding:12px; cursor:pointer;
    font-size:14px; font-weight:700; background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#04101f;
  }
  .demo .replybox{
    margin:0 18px 18px; border-left:3px solid var(--accent); background:rgba(53,224,255,.07);
    border-radius:0 10px 10px 0; padding:12px 14px; font-size:13.5px; line-height:1.8; color:#d7e6ff;
  }
  .demo .apicall{
    margin:0 18px 18px; border:1px dashed rgba(79,140,255,.5); border-radius:10px; padding:12px 14px;
    font-family:Consolas,monospace; font-size:12.5px; color:var(--accent); overflow-x:auto; white-space:pre;
  }
  .demo .apiout{margin:0 18px 22px;}
  footer{margin-top:40px; text-align:center; color:var(--muted); font-size:12px; letter-spacing:1px;}
</style>
</head>
<body>
<div class="wrap">
  <!-- ======= 头部 ======= -->
  <header class="hero">
    <div class="bg" id="heroBg"></div>
    <div class="veil"></div>
    <div class="hero-inner">
      <span class="hero-badge">EMPOWERING CONNECTIONS · CREATING A DIGITAL FUTURE</span>
      <h1>福建省联迪移动支付研究与应用重点实验室<br/><b>实验项目介绍</b></h1>
      <p>气候环境 · 机械环境 · 电磁兼容 · 电池 · 射频NFC · 声学 · 自动化 · 失效分析</p>
      <div class="searchbar">
        <input id="q" type="text" placeholder="搜索，如：跌落、温度、NFC、触摸屏……" />
        <button onclick="doSearch()">查找项目</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <!-- ======= 主区 ======= -->
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="stat" id="stat">…</div>
  </div>
  <div id="grid"></div>

  <!-- ======= 数字人调用演示 ======= -->
  <section class="demo">
    <div class="dh"><span class="dot"></span><b>小联 · 数字人调用演示</b>
      <span class="tag">reply + api_call → API → H5 渲染</span></div>
    <div class="rowg">
      <div>
        <label>选择询问（项目库应答条目）</label>
        <select id="qaSel"></select>
      </div>
      <div>
        <label>或手动输入一句提问</label>
        <input id="qaInput" placeholder="例如：高低温测试怎么做" />
      </div>
    </div>
    <div id="replyBox" class="replybox" style="display:none"></div>
    <div id="apiCallBox" class="apicall" style="display:none"></div>
    <div id="apiOut" class="apiout"></div>
    <button class="btn" onclick="runDemo()">模拟数字人发出应答与 api_call</button>
  </section>

  <footer>福建省联迪移动支付研究与应用重点实验室 | 实验项目介绍程序 v1.0 | API: GET /api/v1/projects?category=&q=</footer>
</div>

<!-- ======= 详情浮层 ======= -->
<div class="modal" id="modal">
  <div class="mask" onclick="closeDetail()"></div>
  <div class="detail">
    <button class="dclose" onclick="closeDetail()">✕</button>
    <div class="hero"><div class="bg" id="dHero"></div><div class="veil"></div></div>
    <div class="dbody" id="dBody"></div>
  </div>
</div>

<script>
"use strict";
const API = "/api/v1";
const IMG = (prompt, size="landscape_16_9") =>
  "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=" +
  encodeURIComponent(prompt) + "&image_size=" + size;

const IMGPOOL = {
  hero: IMG("modern electronics testing laboratory interior with advanced equipment, blue and cyan lighting, clean high-tech atmosphere, wide view"),
  climate: IMG("climate test chamber laboratory with programmable temperature and humidity chambers, thermal shock chamber, salt mist tester, blue tech lighting"),
  mechanical: IMG("mechanical environmental testing laboratory with drop test machines for electronic devices, cable flexing tester, steel ball impact tester"),
  electrical: IMG("EMC testing laboratory with ESD simulator, lightning surge generator and EFT tester, professional electronic test equipment"),
  battery: IMG("lithium battery testing equipment with high temperature oven on a bench, professional battery laboratory"),
  rf: IMG("OTA anechoic chamber interior with dual polarized broadband antennas, RF testing laboratory"),
  acoustic: IMG("acoustic measurement system testing speakers and microphone in laboratory, professional audio test equipment"),
  robot: IMG("intelligent testing robot in automation laboratory, robot arm scanning barcode, high tech"),
  failure: IMG("failure analysis laboratory microscope inspecting electronic chip, dye and pry analysis, professional"),
  fallback: IMG("electronic device testing laboratory, professional test equipment on benches, blue lighting")
};

let CATS = [];
let PROJECTS = [];
let curCat = "all", curQ = "";

/* ---------- 数据 ---------- */
async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function loadMeta(){
  const d = await fetchJSON(API);
  CATS = d.meta.categories;
  const hero = document.getElementById("heroBg");
  hero.style.backgroundImage = `url("${IMGPOOL.hero}")`;
  renderTabs(); renderChips(); renderRarities();
  await loadList();
  await loadQaEntries();
}

async function loadList(){
  const params = new URLSearchParams();
  if(curCat && curCat !== "all") params.set("category", curCat);
  if(curQ) params.set("q", curQ);
  const d = await fetchJSON(API + "/projects" + (params.toString() ? "?" + params : ""));
  PROJECTS = d.projects || [];
  renderGrid();
}

function renderRarities(){
  // 建立分类与图片映射
  window.CATIMG = Object.assign({}, IMGPOOL);
}

function catImg(cat){
  if(CATIMG[cat]) return CATIMG[cat];
  const p = CATS.find(c => c.key === cat);
  return p ? IMG("electronic testing projects, " + p.name) : IMGPOOL.fallback;
}

function renderTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.textContent = "全部";
  allBtn.className = curCat === "all" ? "on" : "";
  allBtn.onclick = () => { curCat = "all"; setHash(); renderTabs(); loadList(); };
  t.appendChild(allBtn);
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c.name;
    b.className = curCat === c.key ? "on" : "";
    b.onclick = () => { curCat = c.key; setHash(); renderTabs(); loadList(); };
    t.appendChild(b);
  });
}

function renderChips(){
  const c = document.getElementById("chips");
  c.innerHTML = "";
  ["跌落", "温度", "NFC", "触摸屏", "电池", "静电", "机器人", "声学"].forEach(k => {
    const b = document.createElement("button");
    b.textContent = k;
    b.onclick = () => { document.getElementById("q").value = k; doSearch(); };
    c.appendChild(b);
  });
}

function setHash(){
  const viaQ = curQ ? "&q=" + encodeURIComponent(curQ) : "";
  location.hash = curCat && curCat !== "all" ? "#/list?category=" + curCat + viaQ : "#/list" + viaQ;
}

function renderGrid(){
  const g = document.getElementById("grid");
  document.getElementById("stat").innerHTML = "共 <b>" + PROJECTS.length + "</b> 个实验项目"
    + (curCat !== "all" ? " · <b>" + (CATS.find(c=>c.key===curCat)||{}).name + "</b>" : "")
    + (curQ ? " · 关键词「<b>" + curQ + "</b>」" : "");
  if(!PROJECTS.length){
    g.innerHTML = '<div class="empty"><b>没有找到匹配的实验项目</b>换个关键词试试，例如：跌落 / 温度 / NFC / 触摸屏</div>';
    return;
  }
  g.innerHTML = "";
  PROJECTS.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openDetail(p.id);
    card.innerHTML =
      '<div class="pic" style="background-image:url(\'' + catImg(p.category) + '\')">' +
        '<span class="cid">' + p.id.toUpperCase() + '</span>' +
        '<span class="cat">' + p.category_name + '</span></div>' +
      '<div class="body"><h3>' + p.name + '</h3>' +
      '<div class="en">' + p.name_en + '</div>' +
      '<div class="tags">' + p.tags.map(t => "<span>" + t + "</span>").join("") + '</div></div>';
    g.appendChild(card);
  });
}

function doSearch(){
  const v = document.getElementById("q").value.trim();
  curQ = v; setHash(); renderTabs(); loadList();
}

/* ---------- 详情 ---------- */
async function openDetail(id){
  const d = await fetchJSON(API + "/projects/" + encodeURIComponent(id));
  const p = d.project;
  location.hash = "#/project/" + id;
  document.getElementById("dHero").style.backgroundImage = "url('" + catImg(p.category) + "')";
  const h = document.getElementById("dBody");
  h.innerHTML = `
    <h2>${p.id.toUpperCase()} · ${p.name}</h2>
    <div class="en">${p.name_en}</div>
    <div class="simbox" id="simbox">
      <div class="simhead"><span class="dot"></span>交互式 3D 拆解仿真
        <button class="simfull" type="button" onclick="fullSim(this)">全屏</button></div>
      <iframe id="simFrame" src="/sims/sim.html?p=${p.id}" loading="lazy" title="3D仿真"></iframe>
      <div class="simtip">拖拽旋转 · 滚轮缩放 · 拆解 / 透视 / 外壳 按钮 · 静置片刻自动导览</div>
    </div>
    <div class="sect"><h4>试验设备</h4>
      <ul>${p.devices.map(x => "<li>" + x + "</li>").join("")}</ul></div>
    <div class="sect"><h4>执行标准</h4><div class="pillrow">${p.standards.map(x => "<span>" + x + "</span>").join("")}</div></div>
    <div class="sect"><h4>主要作用</h4><p>${p.main_function}</p></div>
    <div class="sect"><h4>案例介绍</h4><p>${p.case_intro}</p></div>
    <div class="sect"><h4>试验怎么做</h4><p>${p.how_to}</p></div>`;
  document.getElementById("modal").classList.add("open");
}
function fullSim(btn){
  const box = document.getElementById("simbox");
  const on = box.classList.toggle("on");
  btn.textContent = on ? "退出全屏" : "全屏";
}
function closeDetail(){ document.getElementById("modal").classList.remove("open"); }

/* ---------- 数字人调用演示 ---------- */
async function loadQaEntries(){
  try{
    const r = await fetch("/lab_project_api_qa.json");
    const d = await r.json();
    window.QA = d.entries;
    window.PROTO = d.api_protocol;
    const sel = document.getElementById("qaSel");
    sel.innerHTML = "";
    d.entries.forEach((e, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = e.id + " " + e.question;
      sel.appendChild(o);
    });
  }catch(e){ /* 库文件未托管时忽略演示选择器 */ }
}

async function runDemo(){
  const selIdx = document.getElementById("qaSel").value;
  const manual = document.getElementById("qaInput").value.trim();
  let entry = null;
  if(!manual && window.QA && selIdx !== "") entry = window.QA[+selIdx];
  if(!entry){
    if(!window.QA) return alert("未加载应答库，请先启动服务后重试。");
    // 手动输入：按关键词近似匹配演示
    entry = matchEntry(manual) || window.QA[window.QA.length - 1];
  }
  const reply = document.getElementById("replyBox");
  const apic = document.getElementById("apiCallBox");
  const out = document.getElementById("apiOut");
  reply.style.display = "block";
  reply.textContent = "🗣 " + (entry.reply || "");
  apic.style.display = "block";
  apic.textContent = "api_call → " + JSON.stringify(entry.api_call, null, 0)
    + "\n  （api_call 只驱动屏幕渲染，不进语音播报）";
  out.innerHTML = '<div class="stat">正在调用实验项目介绍程序 API…</div>';
  const res = await execApiCall(entry.api_call);
  renderApiOut(out, entry, res);
}

function matchEntry(text){
  if(!window.QA || !text) return null;
  let best = null, bs = -1;
  window.QA.forEach(e => {
    const blob = [e.question].concat(e.keywords).join(" ");
    let s = 0;
    text.split(/\s+/).forEach(w => { if(blob.includes(w)) s++; });
    if(s > bs){ bs = s; best = e; }
  });
  return bs > 0 ? best : null;
}

async function execApiCall(call){
  const a = call.action, p = call.payload || {};
  try{
    if(a === "show_project"){
      const d = await fetchJSON(API + "/projects/" + encodeURIComponent(p.id));
      return {ok: true, kind: "detail", data: d.project, raw: d};
    }
    const params = new URLSearchParams();
    if(p.category) params.set("category", p.category);
    if(p.keywords && p.keywords.length) params.set("q", p.keywords.join(" "));
    const d = await fetchJSON(API + "/projects" + (params.toString() ? "?" + params : ""));
    return {ok: true, kind: "list", action: a, data: d.projects, total: d.total, raw: d};
  }catch(err){
    return {ok: false, error: String(err)};
  }
}

function renderApiOut(out, entry, res){
  if(!res.ok){
    out.innerHTML = '<div class="stat" style="color:#ff7b7b">API 调用失败：' + res.error + "（error_reply：" + (entry.error_reply||"") + "）</div>";
    return;
  }
  if(res.kind === "detail"){
    out.innerHTML = "";
    out.appendChild(buildDetailInline(res.data));
  }else{
    let html = '<div class="stat">「' + entry.question + '」→ 程序筛选结果：总 <b>' + res.total + '</b> 个项目</div><div class="chips" style="justify-content:flex-start; margin-top:8px;">';
    res.data.forEach(p => {
      html += '<button onclick="openDetail(\'' + p.id + '\')" title="' + p.name + '">' + p.id.toUpperCase() + ' ' + p.name + '</button>';
    });
    html += "</div>";
    out.innerHTML = html;
  }
}

function buildDetailInline(p){
  const d = document.createElement("div");
  d.className = "detail";
  d.style.maxWidth = "100%";
  d.style.animation = "none";
  d.innerHTML = `
    <div class="dbody">
      <h2>${p.id.toUpperCase()} · ${p.name}</h2>
      <div class="en">${p.name_en}</div>
      <div class="sect"><h4>执行标准</h4><div class="pillrow">${p.standards.map(x => "<span>" + x + "</span>").join("")}</div></div>
      <div class="sect"><h4>试验怎么做</h4><p>${p.how_to || p.main_function}</p></div>
      <div class="sect"><h4>案例介绍</h4><p>${p.case_intro}</p></div>
    </div>`;
  return d;
}

/* ---------- hash 路由（响应 api_call 的屏幕渲染指令） ---------- */
function onHash(){
  const raw = location.hash.replace(/^#\/?/, "");
  if(!raw) return;
  if(raw.startsWith("project/")){
    const id = raw.split("/")[1].split("?")[0];
    if(id && id !== document._lastId){ document._lastId = id; openDetail(id); }
  }else if(raw.startsWith("list")){
    const qs = new URLSearchParams((raw.split("?")[1] || ""));
    curCat = qs.get("category") || "all";
    curQ = qs.get("q") || "";
    document.getElementById("q").value = curQ;
    renderTabs(); loadList();
  }
}
window.addEventListener("hashchange", onHash);

loadMeta().then(onHash).catch(err => {
  document.getElementById("grid").innerHTML =
    '<div class="empty"><b>无法连接实验项目介绍程序 API</b>' + err.message + '<br/>请先运行: python server.py</div>';
});
</script>
